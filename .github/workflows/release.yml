# VivaMirror automated release delivery (version-tag triggered).
#
# Automated RELEASE DELIVERY, not hosting deployment: this produces a
# versioned ZIP of the tracked application source plus a GitHub release
# carrying it as an asset. Nothing is deployed to any server.
#
# Checks run before packaging (same lint + offline test suite as CI).
# The archive is built with `git archive`, so it contains tracked files
# only — .git, virtual environments, caches, secrets, local databases,
# recordings, and downloaded models can never sneak in. Contents are
# validated before upload.
name: release

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    name: checks before packaging
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install core and dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check app tests

      - name: Test (pytest, offline and model-free)
        run: python -m pytest tests/ -q

  deliver:
    name: package and publish prototype archive
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out repository (full history for the tag)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Package tracked source as a versioned ZIP
        run: |
          git archive -o "vivamirror-${TAG}.zip" "$TAG"
          python - <<'EOF'
          import os, sys, zipfile
          tag = os.environ["TAG"]
          path = f"vivamirror-{tag}.zip"
          names = zipfile.ZipFile(path).namelist()
          required = {"app/main.py", "data/questions.json",
                      "requirements.txt", "README.md"}
          missing = required - set(names)
          assert not missing, f"missing from archive: {missing}"
          forbidden = (".db", ".sqlite", ".sqlite3", ".wav", ".mp3",
                       ".m4a", ".ogg", ".env", "secrets", "credentials")
          leaked = [n for n in names
                    if n.endswith(forbidden) or n.startswith((".venv/", ".git/"))]
          assert not leaked, f"runtime/private files leaked: {leaked}"
          print(f"archive OK: {len(names)} tracked files, "
                f"{os.path.getsize(path)} bytes")
          EOF

      - name: Upload archive as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vivamirror-${{ github.ref_name }}
          path: vivamirror-${{ github.ref_name }}.zip

      - name: Publish GitHub release with the archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" "vivamirror-${TAG}.zip" \
            --title "VivaMirror ${TAG} (practice prototype)" \
            --notes "Prototype practice build (typed + spoken flow, local SQLite history). Honest limits: paraphrase-blind matching, session/assisted caveats, mic-in-browser needs a manual check, no hosting provided — this archive is delivery, not deployment. See README §11/§12 and docs/evaluation.md."
